# Refreshes data/generated/*.json from the job source APIs on a schedule and
# commits the result. The site itself is rebuilt from the committed dataset,
# so a data commit is the whole refresh.
name: Ingest jobs

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm ingest
      - run: npx tsc --noEmit
      - run: pnpm test
      - run: pnpm build
      - name: Commit refreshed dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add data/generated
          if git diff --staged --quiet; then
            echo "No dataset changes; nothing to commit."
            exit 0
          fi
          git commit -m "chore(data): refresh job dataset"
          git push
      # The bot email already reports each failed run; this tracking issue is
      # the durable inbox item that records every failure in one place.
      - name: Record failure in the tracking issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Ingest pipeline failure tracker"
          BODY="Ingest run failed at $(date -u +%Y-%m-%dT%H:%MZ): ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          NUMBER=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --limit 1 --jq '.[0].number')
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
      # A failed feed keeps its previous roles for up to three nights (issues 46, 47, 59).
      # Each night that stands on carried roles or lost a feed is recorded in the
      # tracking issue. The step runs last, so a night that fails the type check,
      # the tests or the build posts nothing. The step only reports, so it must
      # never fail the run.
      - name: Report carried roles and failed feeds in the tracking issue
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BODY=$(node -e '
            const stats = require("./data/generated/stats.json");
            const carried = stats.carried ?? { total: 0, bySource: {} };
            const failedFeeds = stats.failedFeeds ?? [];
            // one feed is a source and unit pair, as run.ts counts them: a feed can report more than once
            const failedFeedCount = new Set(failedFeeds.map((feed) => feed.source + "/" + feed.unit)).size;
            if (carried.total < 1 && failedFeedCount === 0) process.exit(0);
            const headline =
              "Latest run: " + failedFeedCount + " feeds failed, " + carried.total + " roles kept from the previous refresh.";
            const bySource = Object.entries(carried.bySource).map(([source, count]) => source + " " + count).join(", ");
            // a feed that reported more than once gets one line, its last report, keyed as the count above keys it
            const feeds = [...new Map(failedFeeds.map((feed) => [feed.source + "/" + feed.unit, feed])).values()].map(
              (feed) =>
                "- " +
                feed.source +
                " " +
                feed.unit +
                ": " +
                (feed.transient ? "transient" : "not transient") +
                (feed.status ? " (HTTP " + feed.status + ")" : "") +
                ": " +
                feed.message
            );
            console.log(
              [
                headline,
                "Dataset generated at " + stats.generatedAt + ".",
                "Carried by source: " + (bySource || "none"),
                "Failed feeds:",
                ...feeds,
                "Run: " + process.argv[1],
              ].join("\n")
            );
          ' "$RUN_URL")
          if [ -z "$BODY" ]; then
            echo "No carried roles and no failed feeds; nothing to report."
            exit 0
          fi
          TITLE="Ingest pipeline failure tracker"
          # an absent issue must answer nothing: a bare .[0].number prints null
          NUMBER=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --limit 1 --jq '.[0].number // empty')
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --body "$BODY"
          else
            # a tracker closed after an incident must not silence the nights that follow
            gh issue create --title "$TITLE" --body "$BODY"
          fi
