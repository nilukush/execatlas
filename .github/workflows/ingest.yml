# Refreshes data/generated/*.json from the job source APIs on a schedule and
# commits the result. The site itself is rebuilt from the committed dataset,
# so a data commit is the whole refresh.
name: Ingest jobs

on:
  schedule:
    # Daily at 03:17 UTC, off the hour to ease scheduler load.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm ingest
      - name: Commit refreshed dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated
          if git diff --staged --quiet; then
            echo "No dataset changes; nothing to commit."
            exit 0
          fi
          git commit -m "chore(data): refresh job dataset"
          git push
