# Refreshes data/generated/*.json from the job source APIs on a schedule and
# commits the result. The site itself is rebuilt from the committed dataset,
# so a data commit is the whole refresh.
name: Ingest jobs

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm ingest
      - run: npx tsc --noEmit
      - run: pnpm test
      - run: pnpm build
      - name: Commit refreshed dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add data/generated
          if git diff --staged --quiet; then
            echo "No dataset changes; nothing to commit."
            exit 0
          fi
          git commit -m "chore(data): refresh job dataset"
          git push
      # The bot email already reports each failed run; this tracking issue is
      # the durable inbox item that records every failure in one place.
      - name: Record failure in the tracking issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Ingest pipeline failure tracker"
          BODY="Ingest run failed at $(date -u +%Y-%m-%dT%H:%MZ): ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          NUMBER=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --limit 1 --jq '.[0].number')
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
