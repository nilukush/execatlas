# Weekly end-to-end journeys against a fresh build: the dataset asset
# fetch, the URL-carried listing state, the stats scorecard and the visa
# signal card. Component tests pin the logic; this proves the shipped
# bytes in a real browser.
name: E2E journeys

on:
  workflow_dispatch:
  schedule:
    - cron: "33 6 * * 1"

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm e2e
